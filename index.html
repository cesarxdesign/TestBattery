<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TestBattery</title>
<style>
:root{--bg:#0e0f11;--panel:#17191c;--line:#24272c;--fg:#e8eaed;--dim:#9aa0a6;--dimmer:#6b7075;--acc:#7aa2f7;--good:#7ec699;--warn:#e0af68;--bad:#ff6b6b}
@media (prefers-color-scheme:light){:root{--bg:#f6f7f9;--panel:#fff;--line:#e3e6ea;--fg:#1a1c1e;--dim:#5f6368;--dimmer:#8a8f94;--acc:#3b5bdb;--good:#2f9e44;--warn:#e8590c;--bad:#e03131}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:14px 20px 0;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
header h1{font-size:17px;margin:0}
header .m{color:var(--dim);font-size:12.5px}
.tabs{display:flex;gap:2px;padding:6px 12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);padding:8px 12px;font-size:13px;cursor:pointer}
.tab.on{color:var(--fg);border-bottom-color:var(--acc)}
.tab .n{color:var(--dimmer);margin-left:6px;font-size:11.5px}
.split{display:flex;height:calc(100vh - 92px)}
.list{width:60%;overflow:auto;padding:14px;border-right:1px solid var(--line)}
.pane{width:40%;overflow:auto;padding:18px 20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:8px;cursor:pointer;display:flex;gap:12px;align-items:stretch}
.card:hover,.card.sel{border-color:var(--acc)}
.card .body{flex:1;min-width:0}
.card .t{font-weight:600}
.card .t a{color:inherit;text-decoration:none}
.card .t a:hover{color:var(--acc);text-decoration:underline}
.card .c{color:var(--dim);font-size:12.5px}
.card .why1{color:var(--dim);font-size:12.5px;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tags{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.tag{border:1px solid var(--line);border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.tag.bad{border-color:var(--bad);color:var(--bad)}
.tag.who{border:0;color:var(--dimmer)}
.group{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin:16px 2px 8px}
.group:first-child{margin-top:0}
.pane h2{margin:0;font-size:16px}
.row{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.row .k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
.row ul{margin:0;padding-left:16px}
.in{color:var(--good)}.out{color:var(--bad)}
.kind{margin:12px 0 8px;font-weight:600}
a.go{color:var(--acc)}
pre{white-space:pre-wrap;font:12px/1.45 inherit;max-height:460px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px}
.empty{color:var(--dim);padding:30px}
.calls{display:flex;gap:10px;margin:14px 0 6px}
.calls button{flex:1;padding:14px 10px;font:600 15px/1.2 inherit;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.calls .bad:hover,.calls .bad.on{border-color:var(--bad);background:var(--bad);color:#fff}
.calls .ok:hover,.calls .ok.on{border-color:var(--good);background:var(--good);color:#fff}
.tag.call-bad{border-color:var(--bad);background:var(--bad);color:#fff}
.calls{flex-wrap:wrap}
.calls .dead,.calls .see{flex:.6}
.calls .see:hover,.calls .see.on{border-color:var(--acc);background:var(--acc);color:#fff}
.tag.call-note{border-color:var(--acc);background:var(--acc);color:#fff}
.calls .dead:hover,.calls .dead.on{border-color:var(--dim);background:var(--dim);color:var(--bg)}
.tag.call-dead{border-color:var(--dim);background:var(--dim);color:var(--bg)}
.tag.call-ok{border-color:var(--good);background:var(--good);color:#fff}
.card.called{opacity:.55}
textarea#note{width:100%;min-height:92px;margin:4px 0 8px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-family:inherit;font-size:14px;line-height:1.45;resize:vertical}
textarea#note:focus{outline:0;border-color:var(--acc)}
.saved{color:var(--dimmer);font-size:11.5px;margin:-4px 0 8px}
@media (max-width:820px){.split{flex-direction:column;height:auto}.list,.pane{width:100%;border-right:0}}
</style></head><body>
<header><h1>TestBattery</h1><span class="m" id="meta"></span></header>
<div class="tabs" id="tabs"></div>
<div class="split"><div class="list" id="list"></div><div class="pane" id="pane"><div class="empty">Select a role.</div></div></div>
<script>
// My calls on JobRadar's roles, held against what its filter says now. Every card
// is a role where the two disagree. battery.py in JobRadar writes battery.json.
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let B=null, SEL=null, TAB="all";
// My verdict on each disagreement: was the filter wrong to cut it, or right?
// Kept in this browser; battery.py --calls collects it from the open tab.
let CALLS={}; try{CALLS=JSON.parse(localStorage.getItem("tb-calls")||"{}");}catch(e){}
function store(id){
  const x=CALLS[id];
  if(x&&!x.call&&!(x.note||"").trim()) delete CALLS[id];
  try{localStorage.setItem("tb-calls",JSON.stringify(CALLS));}catch(e){}
}
// A note on why, saved as it is typed. It stays with the verdict.
function note(f,text){
  CALLS[f.id]={...(CALLS[f.id]||{call:null,company:f.company,title:f.title}),note:text,at:new Date().toISOString()};
  store(f.id);
  $("saved").textContent=text.trim()?"saved":"";
}
function call(f,c){
  const was=CALLS[f.id]||{};
  CALLS[f.id]={...was,call:was.call===c?null:c,at:new Date().toISOString(),company:f.company,title:f.title};
  store(f.id);
  // stays on the role: the note on why is written next
  render();
}
const TABS=[["all","All",f=>!f.soft],["location","Location",f=>!f.soft&&/location/.test(f.failed_on||"")],
  ["role","Role",f=>!f.soft&&/role|title/.test(f.failed_on||"")],
  ["other","Other",f=>!f.soft&&!/location|role|title/.test(f.failed_on||"")]];
const link=f=>f.read_url||f.url;
// A dead link cannot be judged: it leaves the list the moment it is marked.
const dead=f=>(CALLS[f.id]||{}).call==="dead";
function rows(){return B.fails.filter(f=>!dead(f)).filter(TABS.find(t=>t[0]===TAB)[2]);}
function render(){
  $("meta").textContent="run "+B.at+" · rules "+B.criteria+" · "+B.fails.filter(f=>!dead(f)).length+" of "+B.cases+" known answers disagree · "+B.fails.filter(f=>!dead(f)&&CALLS[f.id]&&CALLS[f.id].call).length+" with my verdict"+(B.settled?" · "+B.settled+" settled as correctly cut":"");
  $("tabs").innerHTML=TABS.map(t=>'<button class="tab'+(t[0]===TAB?" on":"")+'" data-t="'+t[0]+'">'+t[1]+'<span class="n">'+(B.fails.filter(f=>!dead(f)).filter(t[2]).length||"")+'</span></button>').join("");
  $("tabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{TAB=b.dataset.t;SEL=null;render();});
  const R=rows(), kinds=[...new Set(R.map(f=>f.kind))];
  $("list").innerHTML=R.length?kinds.map(k=>'<div class="group">'+esc(k)+' · '+R.filter(f=>f.kind===k).length+'</div>'
    +R.filter(f=>f.kind===k).map(f=>'<div class="card'+(f.id===SEL?" sel":"")+(CALLS[f.id]&&CALLS[f.id].call?" called":"")+'" data-id="'+f.id+'"><div class="body">'
      +'<div class="t">'+(link(f)?'<a href="'+esc(link(f))+'" target="_blank" rel="noopener">'+esc(f.title)+'</a>':esc(f.title))+'</div>'
      +'<div class="c">'+esc(f.company)+(f.location?' · '+esc(f.location):'')+'</div>'
      +'<div class="why1">'+esc(f.why||"")+'</div></div>'
      +'<div class="side"><div class="tags"><span class="tag bad">'+esc(f.failed_on||f.lane||"")+'</span><span class="tag">'+esc(f.lane||"")+'</span><span class="tag who">'+esc(f.by||"")+'</span></div>'
      +'<div class="tags">'+(CALLS[f.id]&&CALLS[f.id].call?'<span class="tag call-'+({incorrect:"bad",correct:"ok",dead:"dead",note:"note"})[CALLS[f.id].call]+'">'+({dead:"dead link",note:"see note"}[CALLS[f.id].call]||CALLS[f.id].call+"ly cut")+'</span>':'')
        +(CALLS[f.id]&&(CALLS[f.id].note||"").trim()&&CALLS[f.id].call!=="note"?'<span class="tag">note</span>':'')
        +'<span class="tag who">'+(f.still_up?"still up":"gone")+'</span></div></div></div>').join("")).join("")
    :'<div class="empty">Nothing here: the filter agrees with every known answer'+(TAB==="all"?"":" of this kind")+'.</div>';
  $("list").querySelectorAll(".card").forEach(c=>c.onclick=e=>{if(e.target.tagName==="A")return;SEL=c.dataset.id;render();});
  pane();
}
function pane(){
  const f=B.fails.find(x=>x.id===SEL);
  if(!f){$("pane").innerHTML='<div class="empty">Select a role.</div>';return;}
  const row=(k,h)=>h?'<div class="row"><span class="k">'+k+'</span><span>'+h+'</span></div>':"";
  const sig=(f.signals||[]).map(x=>'<li><span class="'+(x.says==="portugal_in"?"in":"out")+'">'+(x.says==="portugal_in"?"Portugal in":"Portugal OUT")
    +'</span> · '+esc(x.where||"")+': “'+esc(x.quote||"")+'”</li>').join("");
  $("pane").innerHTML='<h2>'+esc(f.title)+'</h2><div style="color:var(--dim)">'+esc(f.company)+'</div>'
    +'<div class="calls"><button class="bad'+((CALLS[f.id]||{}).call==="incorrect"?" on":"")+'" id="b-bad">Incorrectly cut</button>'
      +'<button class="ok'+((CALLS[f.id]||{}).call==="correct"?" on":"")+'" id="b-ok">Correctly cut</button>'
      +'<button class="dead'+((CALLS[f.id]||{}).call==="dead"?" on":"")+'" id="b-dead">Dead link</button>'
      +'<button class="see'+((CALLS[f.id]||{}).call==="note"?" on":"")+'" id="b-see" title="reviewed: the reason is in the note">See note</button></div>'
    +'<textarea id="note" placeholder="Why? Saved as you type.">'+esc((CALLS[f.id]||{}).note||"")+'</textarea><div class="saved" id="saved">'+((CALLS[f.id]||{}).note?"saved":"")+'</div>'
    +'<div class="kind">'+esc(f.kind)+'</div>'
    +row("filter says",esc((f.lane||"").toUpperCase())+" · by "+esc(f.by||"")+(f.read?" · read on "+(f.read==="employer"?"the employer’s page":"a job board’s copy"):"")
        +(f.read_at?" · "+esc(String(f.read_at).slice(0,10)):"")+(f.read_criteria?" · rules "+esc(f.read_criteria):""))
    +row("failed on",esc(f.failed_on||""))
    +row("its reason",esc(f.why||""))
    +row("top line",esc(f.top_line||""))
    +(sig?row("statements","<ul>"+sig+"</ul>"):"")
    +row("closed?",f.open_quote?"“"+esc(f.open_quote)+"”":"")
    +row("posting",(f.still_up?"still up":"no longer up: cannot be read again")+(f.location?" · listed location: "+esc(f.location):"")+(f.posted?" · posted "+esc(f.posted):""))
    +row("links",[f.read_url&&'<a class="go" href="'+esc(f.read_url)+'" target="_blank" rel="noopener">the page that was read ↗</a>',
        f.url&&f.url!==f.read_url&&'<a class="go" href="'+esc(f.url)+'" target="_blank" rel="noopener">the posting in the pool ↗</a>'].filter(Boolean).join(" · "))
    +row("page",f.page?'<details><summary>the page as the reader saw it</summary><pre>'+esc(f.page)+'</pre></details>'
        :"No saved copy: it was read before pages were kept, or by the old judge.");
  $("b-bad").onclick=()=>call(f,"incorrect");
  $("b-ok").onclick=()=>call(f,"correct");
  $("b-dead").onclick=()=>{const R=rows(), i=R.findIndex(x=>x.id===f.id); call(f,"dead"); SEL=((R[i+1]||R[i-1])||{}).id||null; render();};
  $("b-see").onclick=()=>{call(f,"note");const n=$("note");if(n&&!n.value.trim())n.focus();};
  $("note").oninput=e=>note(f,e.target.value);
}
fetch("battery.json?"+Date.now()).then(r=>r.json()).then(d=>{B=d;render();})
  .catch(()=>{$("list").innerHTML='<div class="empty">battery.json could not be loaded.</div>';});
</script></body></html>
